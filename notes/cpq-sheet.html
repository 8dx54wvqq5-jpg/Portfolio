<!DOCTYPE html><html><head><style>
body{font-family:monospace;background:#222;color:#fff;margin:0;padding:10px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{background:#333;padding:4px}
.c img{width:100%;height:220px;object-fit:contain;background:#111;display:block}
.c span{font-size:11px}
</style></head><body><div class="g" id="g"></div><script>
const imgs=["cpq-1.png","cpq-2.png","cpq-3.png","cpq-4.png","cpq-5.png","cpq-hero.png"];
const g=document.getElementById('g');
imgs.forEach(n=>{const d=document.createElement('div');d.className='c';const i=new Image();i.src='../assets/'+n;i.onload=()=>{d.querySelector('span').textContent=n+' '+i.naturalWidth+'x'+i.naturalHeight};d.appendChild(i);const s=document.createElement('span');s.textContent=n;d.appendChild(s);g.appendChild(d);});
</script></body></html>
