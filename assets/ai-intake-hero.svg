<svg viewBox="0 0 1280 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI-Assisted Dispute Intake: AI fills fields with High, Medium and Low confidence, every decision is logged, and overrides feed a learning loop">
  <title>AI-Assisted Dispute Intake</title>
  <desc>An intake card with AI-filled fields carrying confidence levels, an audit log strip, and a feedback loop that improves the model over time.</desc>
  <defs>
    <linearGradient id="aiHeroPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#10162A"/>
    </linearGradient>
    <pattern id="aiHeroDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2A3354"/>
    </pattern>
    <marker id="aiHeroArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5B8DEF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="960" fill="url(#aiHeroPaper)"/>
  <rect width="1280" height="960" fill="url(#aiHeroDots)"/>

  <path d="M880 280 A170 170 0 1 1 1020 555" fill="none" stroke="#5B8DEF" stroke-width="3" stroke-dasharray="8 9" opacity="0.6" marker-end="url(#aiHeroArrow)"/>
  <text x="985" y="280" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="700" fill="#9FB7F5">every override</text>
  <text x="985" y="312" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="700" fill="#9FB7F5">improves the AI</text>
  <text x="985" y="610" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" letter-spacing="0.04em" fill="#6E7AA8">FEEDBACK LOOP</text>

  <rect x="170" y="148" width="640" height="664" rx="28" fill="#000000" opacity="0.25"/>
  <rect x="170" y="132" width="640" height="664" rx="28" fill="#161B2E" stroke="#2C3658" stroke-width="2"/>

  <path d="M214 192 L220 204 L232 208 L220 212 L214 224 L208 212 L196 208 L208 204 Z" fill="#5B8DEF"/>
  <text x="244" y="216" font-family="Manrope, system-ui, sans-serif" font-size="28" font-weight="700" fill="#F2F5FC">AI-assisted intake</text>
  <text x="772" y="212" text-anchor="end" font-family="ui-monospace, monospace" font-size="17" fill="#7B86AD">fiserv</text>
  <line x1="198" y1="248" x2="782" y2="248" stroke="#26304E" stroke-width="2"/>

  <rect x="198" y="276" width="584" height="92" rx="18" fill="#1E2540" stroke="#2C3658"/>
  <text x="226" y="316" font-family="ui-monospace, monospace" font-size="18" fill="#7B86AD">amount</text>
  <text x="226" y="350" font-family="Manrope, system-ui, sans-serif" font-size="26" font-weight="700" fill="#F2F5FC">$47.50</text>
  <rect x="600" y="304" width="148" height="44" rx="22" fill="#15372B"/>
  <text x="674" y="333" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="19" font-weight="700" fill="#5FD8A8">High</text>

  <rect x="198" y="384" width="584" height="92" rx="18" fill="#1E2540" stroke="#2C3658"/>
  <text x="226" y="424" font-family="ui-monospace, monospace" font-size="18" fill="#7B86AD">merchant</text>
  <text x="226" y="458" font-family="Manrope, system-ui, sans-serif" font-size="26" font-weight="700" fill="#F2F5FC">Uber</text>
  <rect x="580" y="412" width="168" height="44" rx="22" fill="#3A2F12"/>
  <text x="664" y="441" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="19" font-weight="700" fill="#E8B85E">Medium</text>

  <rect x="198" y="492" width="584" height="92" rx="18" fill="#1E2540" stroke="#2C3658"/>
  <text x="226" y="532" font-family="ui-monospace, monospace" font-size="18" fill="#7B86AD">dispute type</text>
  <text x="226" y="566" font-family="Manrope, system-ui, sans-serif" font-size="26" font-weight="700" fill="#F2F5FC">Duplicate charge</text>
  <rect x="600" y="520" width="148" height="44" rx="22" fill="#1B2A4D"/>
  <text x="674" y="549" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="19" font-weight="700" fill="#7FA3F2">Low</text>

  <rect x="198" y="600" width="584" height="68" rx="16" fill="#0E1322" stroke="#262E4C"/>
  <circle cx="232" cy="634" r="6" fill="#3FCB8E"/>
  <text x="254" y="640" font-family="ui-monospace, monospace" font-size="17" fill="#D6DCF2">audit log</text>
  <text x="756" y="640" text-anchor="end" font-family="ui-monospace, monospace" font-size="15" fill="#7B86AD">every AI + human decision</text>

  <text x="198" y="752" font-family="Manrope, system-ui, sans-serif" font-size="20" font-weight="600" fill="#AEB8DC">AI classifies. Humans confirm.</text>
  <text x="198" y="780" font-family="Manrope, system-ui, sans-serif" font-size="20" font-weight="600" fill="#AEB8DC">Every decision is auditable.</text>
</svg>
